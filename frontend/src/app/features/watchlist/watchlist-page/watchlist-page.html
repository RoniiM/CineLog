<div class="watchlist-page">
  <h1>My Watchlist</h1>

  @if (watchlistService.loading()) {
    <div class="state-row">
      <app-loading-spinner />
    </div>
  } @else if (watchlistService.items().length === 0) {
    <p class="empty-state">Your watchlist is empty.</p>
  } @else {
    <div class="movie-grid">
      @for (item of watchlistService.items(); track item.id) {
        <div class="watchlist-tile">
          <app-movie-card [movie]="item.movie" (clicked)="openMovie($event)" />
          <button type="button" class="remove-btn" (click)="remove(item.movie.id, $event)">Remove</button>
        </div>
      }
    </div>
  }
</div>
