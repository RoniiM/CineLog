<div class="star-rating" [class.readonly]="isReadonly()">
  @for (star of stars; track star) {
    <button
      type="button"
      class="star"
      [class.filled]="star <= rating()"
      [disabled]="isReadonly()"
      (click)="selectRating(star)"
      [attr.aria-label]="'Rate ' + star + (star > 1 ? ' stars' : ' star')"
    >★</button>
  }
</div>
